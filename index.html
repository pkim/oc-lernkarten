<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organische Chemie – Lernkarten</title>
<style>
  :root{
    --bg:#0f1226; --panel:#1a1f3a; --panel2:#232a4d; --txt:#e8ecf8; --mut:#9aa3c7;
    --acc:#5b8cff; --good:#39c07a; --warn:#f0a85a; --bad:#ef5b6b; --line:#2c345e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt)}
  header{padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:650}
  .grow{flex:1}
  button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
    padding:8px 14px;border-radius:10px;font-size:14px;transition:.15s}
  button:hover{border-color:var(--acc)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:8px;border-radius:10px;font-size:14px}
  .wrap{max-width:880px;margin:0 auto;padding:18px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:90px}
  .stat .n{font-size:22px;font-weight:700}
  .stat .l{font-size:12px;color:var(--mut)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;margin-top:16px;min-height:240px;
    display:flex;flex-direction:column;justify-content:center}
  .meta{font-size:12px;color:var(--mut);margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .badge{padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px}
  .badge.rxn{border-color:#7a5bff;color:#b9a9ff}
  .badge.der{border-color:var(--good);color:#7ee3ad}
  .badge.mem{border-color:var(--bad);color:#ff9aa6}
  .q{font-size:21px;line-height:1.45}
  .a{font-size:18px;line-height:1.5;border-top:1px dashed var(--line);margin-top:18px;padding-top:16px;color:#dfe6ff}
  .a.hidden{display:none}
  .cardimg{max-width:100%;max-height:300px;background:#fff;border-radius:10px;margin-top:14px;align-self:flex-start}
  .grades{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
  .grades button{padding:12px}
  .g0{border-color:var(--bad)} .g1{border-color:#e8975a} .g2{border-color:#e8d15a} .g3{border-color:var(--good)}
  .muted{color:var(--mut)}
  .hint{color:var(--mut);font-size:13px}
  .pill{font-size:12px;color:var(--mut)}
  .done{text-align:center;padding:40px}
  .toggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .toggle button{border:0;border-radius:0;background:transparent}
  .toggle button.on{background:var(--acc);color:#fff}
  progress{width:100%;height:8px;border-radius:6px;overflow:hidden}
  a.link{color:var(--acc);text-decoration:none}
  .small{font-size:12px}
</style>
</head>
<body>
<header>
  <h1>🧪 Organische Chemie – Lernkarten</h1>
  <span class="pill" id="loadinfo"></span>
  <div class="grow"></div>
  <div class="toggle" id="langToggle" title="Sprache der Vorderseite">
    <button data-lang="de" class="on">DE</button>
    <button data-lang="en">EN</button>
    <button data-lang="both">DE+EN</button>
  </div>
  <button id="resetBtn" title="Lernfortschritt zurücksetzen">↺ Reset</button>
</header>

<div class="wrap">
  <div class="row">
    <label class="small muted">Kapitel:</label>
    <select id="chapterSel"></select>
    <label class="small muted">Modus:</label>
    <select id="modeSel">
      <option value="all">Alle Karten</option>
      <option value="reaction">Nur Reaktionen</option>
      <option value="reaction_mem">Reaktionen: auswendig</option>
      <option value="reaction_der">Reaktionen: herleitbar</option>
    </select>
    <label class="small muted">Priorität:</label>
    <select id="tierSel">
      <option value="all">Alle Tiers</option>
      <option value="1">Tier 1 – essenziell</option>
      <option value="12">Tier 1+2</option>
      <option value="3">Tier 3 – Randthemen</option>
    </select>
    <button id="startBtn" class="primary">Lernen starten</button>
  </div>

  <div class="stats" id="stats"></div>
  <progress id="prog" value="0" max="1"></progress>

  <div id="studyArea" style="display:none">
    <div class="card" id="card">
      <div class="meta" id="cardMeta"></div>
      <div class="q" id="cardFront"></div>
      <img class="cardimg" id="cardImg" style="display:none">
      <div class="a hidden" id="cardBack"></div>
    </div>
    <div id="controls" class="row" style="margin-top:14px">
      <button id="showBtn" class="primary">Antwort zeigen (Leertaste)</button>
    </div>
    <div class="grades" id="grades" style="display:none">
      <button class="g0" data-q="0">Nochmal<br><span class="small muted">&lt;1 min</span></button>
      <button class="g1" data-q="1">Schwer<br><span class="small muted">1→</span></button>
      <button class="g2" data-q="2">Gut<br><span class="small muted">↑</span></button>
      <button class="g3" data-q="3">Einfach<br><span class="small muted">↑↑</span></button>
    </div>
    <p class="hint" id="schedHint"></p>
  </div>

  <div id="doneArea" class="done" style="display:none">
    <h2>✅ Fertig für heute!</h2>
    <p class="muted" id="doneMsg"></p>
    <button class="primary" id="againBtn">Nochmal durchgehen</button>
  </div>
</div>

<script src="cards.js"></script>
<script>
"use strict";
const LS_KEY = "ochem_srs_v1";
let DATA = null, lang = "de", queue = [], current = null, sessionStats = {reviewed:0, again:0};

// ---------- SM-2 spaced repetition ----------
// progress per card id: {ef, reps, interval, due (ISO date), lapses, seen}
function loadProgress(){ try{return JSON.parse(localStorage.getItem(LS_KEY))||{};}catch(e){return {};} }
function saveProgress(p){ localStorage.setItem(LS_KEY, JSON.stringify(p)); }
let PROG = loadProgress();

function todayStr(d){ d=d||new Date(); return d.toISOString().slice(0,10); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return todayStr(d); }

function defaultState(){ return {ef:2.5, reps:0, interval:0, due:todayStr(), lapses:0, seen:0}; }

// quality: 0 again, 1 hard, 2 good, 3 easy  -> map to SM-2 q (0..5)
function sm2(state, quality){
  const qmap = {0:2, 1:3, 2:4, 3:5};
  const q = qmap[quality];
  state.seen = (state.seen||0)+1;
  if(q < 3){
    state.reps = 0; state.interval = 0; state.lapses=(state.lapses||0)+1;
    state.due = todayStr(); // relearn same day
  } else {
    state.reps += 1;
    if(state.reps === 1) state.interval = 1;
    else if(state.reps === 2) state.interval = quality===1?3:6;
    else state.interval = Math.round(state.interval * state.ef);
    if(quality===1) state.interval = Math.max(1, Math.round(state.interval*0.6));
    state.ef = Math.max(1.3, state.ef + (0.1 - (5-q)*(0.08+(5-q)*0.02)));
    state.due = addDays(state.interval);
  }
  return state;
}

// ---------- data ----------
async function loadData(){
  try{
    const res = await fetch("cards.json", {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    DATA = await res.json();
  }catch(e){
    if(window.CARDS){ DATA = window.CARDS; }   // file:// fallback (cards.js)
    else throw e;
  }
  document.getElementById("loadinfo").textContent =
    DATA.cards.length + " Karten · " + (DATA.chapters?.length||0) + " Kapitel";
  fillChapters();
  renderStats();
}
function fillChapters(){
  const sel = document.getElementById("chapterSel");
  sel.innerHTML = "";
  const all = document.createElement("option"); all.value="__all__"; all.textContent="Alle Kapitel";
  sel.appendChild(all);
  (DATA.chapters||[]).forEach(c=>{
    const o=document.createElement("option"); o.value=c.id;
    const cnt = DATA.cards.filter(k=>k.chapter===c.id).length;
    o.textContent = c.name_de + " ("+cnt+")"; sel.appendChild(o);
  });
}

function selectDeck(){
  const ch = document.getElementById("chapterSel").value;
  const mode = document.getElementById("modeSel").value;
  const tier = (document.getElementById("tierSel")||{}).value || "all";
  let cards = DATA.cards.slice();
  if(ch!=="__all__") cards = cards.filter(c=>c.chapter===ch);
  if(mode==="reaction") cards = cards.filter(c=>c.type==="reaction");
  if(mode==="reaction_mem") cards = cards.filter(c=>c.type==="reaction" && c.derivable===false);
  if(mode==="reaction_der") cards = cards.filter(c=>c.type==="reaction" && c.derivable===true);
  if(tier==="1") cards = cards.filter(c=>c.tier===1);
  else if(tier==="12") cards = cards.filter(c=>c.tier===1 || c.tier===2);
  else if(tier==="3") cards = cards.filter(c=>c.tier===3);
  return cards;
}

function buildQueue(){
  const cards = selectDeck();
  const today = todayStr();
  // due cards first (new = due today by default), cap new per session
  const due = cards.filter(c=>{
    const st = PROG[c.id]; if(!st) return true; return st.due <= today;
  });
  // order: lapses/again first, then new, then others by due
  due.sort((a,b)=>{
    const sa=PROG[a.id]||defaultState(), sb=PROG[b.id]||defaultState();
    return (sa.due<sb.due?-1:sa.due>sb.due?1:0) || (sb.lapses||0)-(sa.lapses||0);
  });
  return due;
}

// ---------- UI ----------
function renderStats(){
  const cards = selectDeck();
  const today = todayStr();
  let nw=0, due=0, learned=0;
  cards.forEach(c=>{
    const st=PROG[c.id];
    if(!st){nw++; due++;}
    else { if(st.due<=today) due++; if(st.reps>=1) learned++; }
  });
  const el = document.getElementById("stats");
  el.innerHTML = "";
  const items = [["Karten",cards.length],["Fällig heute",due],["Neu",nw],["Gelernt",learned]];
  items.forEach(([l,n])=>{
    const d=document.createElement("div"); d.className="stat";
    d.innerHTML="<div class='n'>"+n+"</div><div class='l'>"+l+"</div>"; el.appendChild(d);
  });
}

function fmtFront(c){
  if(lang==="both") return (c.front_de||"")+"<div class='muted small' style='margin-top:8px'>"+(c.front_en||"")+"</div>";
  return lang==="en" ? (c.front_en||c.front_de||"") : (c.front_de||c.front_en||"");
}
function fmtBack(c){
  if(lang==="both") return (c.back_de||"")+"<div class='muted small' style='margin-top:10px'>"+(c.back_en||"")+"</div>";
  return lang==="en" ? (c.back_en||c.back_de||"") : (c.back_de||c.back_en||"");
}

function showCard(){
  if(queue.length===0){ finish(); return; }
  current = queue[0];
  document.getElementById("studyArea").style.display="block";
  document.getElementById("doneArea").style.display="none";
  const meta = document.getElementById("cardMeta");
  const chName = (DATA.chapters.find(x=>x.id===current.chapter)||{}).name_de || current.chapter;
  let badges = "<span class='badge'>"+chName+"</span>";
  if(current.unit) badges += "<span class='badge'>Einheit "+current.unit+"</span>";
  if(current.type==="reaction"){
    badges += "<span class='badge rxn'>Reaktion</span>";
    if(current.derivable===true) badges += "<span class='badge der'>herleitbar</span>";
    if(current.derivable===false) badges += "<span class='badge mem'>auswendig</span>";
  }
  meta.innerHTML = badges;
  document.getElementById("cardFront").innerHTML = fmtFront(current);
  const back = document.getElementById("cardBack");
  back.innerHTML = fmtBack(current); back.classList.add("hidden");
  const img = document.getElementById("cardImg");
  if(current.image){ img.src=current.image; img.style.display="block"; } else { img.style.display="none"; }
  document.getElementById("grades").style.display="none";
  document.getElementById("controls").style.display="flex";
  const total = sessionStats.reviewed + queue.length;
  document.getElementById("prog").max = total||1;
  document.getElementById("prog").value = sessionStats.reviewed;
}

function reveal(){
  document.getElementById("cardBack").classList.remove("hidden");
  document.getElementById("grades").style.display="grid";
  document.getElementById("controls").style.display="none";
}

function grade(q){
  const st = PROG[current.id] || defaultState();
  sm2(st, q);
  PROG[current.id] = st; saveProgress(PROG);
  sessionStats.reviewed++;
  queue.shift();
  if(q===0){ sessionStats.again++; queue.push(current); } // requeue at end this session
  document.getElementById("schedHint").textContent =
    "Nächste Wiederholung: " + (q===0 ? "noch in dieser Sitzung" : "in "+st.interval+" Tag(en) ("+st.due+")");
  renderStats();
  showCard();
}

function finish(){
  document.getElementById("studyArea").style.display="none";
  document.getElementById("doneArea").style.display="block";
  document.getElementById("doneMsg").textContent =
    sessionStats.reviewed + " Karten wiederholt · " + sessionStats.again + " als 'Nochmal' markiert.";
}

// ---------- events ----------
document.getElementById("startBtn").onclick = ()=>{
  sessionStats = {reviewed:0, again:0};
  queue = buildQueue();
  if(queue.length===0){ finish(); document.getElementById("doneMsg").textContent="Keine fälligen Karten in dieser Auswahl 🎉"; return; }
  showCard();
};
document.getElementById("showBtn").onclick = reveal;
document.getElementById("grades").addEventListener("click", e=>{
  const b=e.target.closest("button[data-q]"); if(b) grade(parseInt(b.dataset.q));
});
document.getElementById("chapterSel").onchange = renderStats;
document.getElementById("modeSel").onchange = renderStats;
document.getElementById("tierSel").onchange = renderStats;
document.getElementById("againBtn").onclick = ()=>document.getElementById("startBtn").click();
document.getElementById("resetBtn").onclick = ()=>{
  if(confirm("Gesamten Lernfortschritt löschen?")){ PROG={}; saveProgress(PROG); renderStats(); alert("Zurückgesetzt."); }
};
document.getElementById("langToggle").addEventListener("click", e=>{
  const b=e.target.closest("button[data-lang]"); if(!b) return;
  lang=b.dataset.lang;
  [...document.querySelectorAll("#langToggle button")].forEach(x=>x.classList.toggle("on", x===b));
  if(current && document.getElementById("studyArea").style.display!=="none"){
    document.getElementById("cardFront").innerHTML=fmtFront(current);
    document.getElementById("cardBack").innerHTML=fmtBack(current);
  }
});
document.addEventListener("keydown", e=>{
  if(document.getElementById("studyArea").style.display==="none") return;
  if(e.code==="Space"){ e.preventDefault();
    if(document.getElementById("cardBack").classList.contains("hidden")) reveal();
  }
  if(!document.getElementById("cardBack").classList.contains("hidden")){
    if(["1","2","3","4"].includes(e.key)) grade(parseInt(e.key)-1);
  }
});

loadData().catch(err=>{
  document.getElementById("loadinfo").textContent = "Fehler beim Laden von cards.json: "+err;
});
</script>
</body>
</html>
